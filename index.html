<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユーエス硝子 寸法注文票 V2</title>
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="app-header no-print">
    <div>
      <p class="eyebrow">US Glass Works</p>
      <h1>寸法注文票 V2</h1>
    </div>
    <div class="header-actions">
      <button class="btn secondary" id="newProjectBtn" type="button">新規</button>
      <button class="btn secondary" id="saveProjectBtn" type="button">保存</button>
      <button class="btn secondary" id="loadProjectBtn" type="button">読込</button>
      <button class="btn primary" id="showPreviewBtn" type="button">PDFプレビュー</button>
    </div>
  </header>

  <main>
    <section class="screen active" id="inputScreen" aria-label="入力画面">
      <div class="layout">
        <section class="panel">
          <div class="panel-head">
            <h2>案件情報</h2>
          </div>
          <div class="form-grid">
            <label class="field">
              <span>案件名</span>
              <input id="projectName" type="text" placeholder="例: ○○邸 ガラス注文">
            </label>
            <label class="field">
              <span>引取日</span>
              <input id="pickupDate" type="date">
            </label>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>寸法表入力</h2>
            <span class="small-muted">追加した明細が注文票PDFに反映されます</span>
          </div>
          <form class="item-form" id="itemForm">
            <label class="field">
              <span>ガラス種類</span>
              <input id="glassType" type="text" list="glassOptions" placeholder="FL6">
            </label>
            <label class="field compact">
              <span>幅 W</span>
              <input id="width" type="number" min="1" inputmode="numeric" placeholder="770">
            </label>
            <label class="field compact">
              <span>高さ H</span>
              <input id="height" type="number" min="1" inputmode="numeric" placeholder="1032">
            </label>
            <label class="field compact">
              <span>数量</span>
              <input id="quantity" type="number" min="1" inputmode="numeric" value="1">
            </label>
            <label class="field note-field">
              <span>備考</span>
              <input id="note" type="text" placeholder="四方糸面、穴あけ等">
            </label>
            <div class="form-actions">
              <button class="btn primary" id="submitItemBtn" type="submit">明細を追加</button>
              <button class="btn secondary" id="cancelEditBtn" type="button" hidden>編集を取消</button>
            </div>
          </form>
          <datalist id="glassOptions">
            <option value="FL3"></option>
            <option value="FL4"></option>
            <option value="FL5"></option>
            <option value="FL6"></option>
            <option value="FL8"></option>
            <option value="FL10"></option>
            <option value="FL12"></option>
            <option value="F4"></option>
            <option value="F6"></option>
            <option value="FW6.8"></option>
            <option value="PW6.8"></option>
            <option value="FW10"></option>
            <option value="PW10"></option>
            <option value="強化FL4"></option>
            <option value="強化FL5"></option>
            <option value="強化FL6"></option>
            <option value="強化FL8"></option>
            <option value="強化FL10"></option>
            <option value="強化F4"></option>
            <option value="強化F6"></option>
            <option value="合わせ透明3+3"></option>
            <option value="合わせ透明4+4"></option>
            <option value="合わせ透明5+5"></option>
            <option value="合わせ型板4+4"></option>
            <option value="合わせ乳半3+3"></option>
            <option value="合わせ乳半4+4"></option>
            <option value="合わせ乳半5+5"></option>
            <option value="透明ペア"></option>
            <option value="型板ペア"></option>
            <option value="Low-E透明ペア"></option>
            <option value="Low-E型板ペア"></option>
            <option value="網入りペア"></option>
            <option value="耐熱5"></option>
            <option value="耐熱8"></option>
            <option value="ミラー5"></option>
            <option value="複合パネル"></option>
          </datalist>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>注文明細</h2>
            <span class="badge" id="itemCount">0件</span>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>No.</th>
                  <th>ガラス種類</th>
                  <th>寸法 W x H</th>
                  <th>数量</th>
                  <th>備考</th>
                  <th class="actions-col">操作</th>
                </tr>
              </thead>
              <tbody id="itemsBody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </section>

    <section class="screen" id="previewScreen" aria-label="PDFプレビュー画面">
      <div class="preview-toolbar no-print">
        <button class="btn secondary" id="backToInputBtn" type="button">入力画面へ戻る</button>
        <button class="btn primary" id="downloadPdfBtn" type="button">PDF保存</button>
      </div>

      <article class="pdf-page" id="pdfPreview">
        <div class="pdf-title">
          <p>ユーエス硝子</p>
          <h2>寸法注文票</h2>
        </div>
        <div class="pdf-meta">
          <div>
            <span>案件名</span>
            <strong id="previewProjectName">-</strong>
          </div>
          <div>
            <span>引取日</span>
            <strong id="previewPickupDate">-</strong>
          </div>
          <div>
            <span>合計数量</span>
            <strong id="previewTotalQty">0</strong>
          </div>
        </div>
        <table class="pdf-table">
          <thead>
            <tr>
              <th>No.</th>
              <th>ガラス種類</th>
              <th>幅 W</th>
              <th>高さ H</th>
              <th>数量</th>
              <th>備考</th>
            </tr>
          </thead>
          <tbody id="previewBody"></tbody>
        </table>
      </article>
    </section>
  </main>

  <dialog id="loadDialog">
    <form method="dialog">
      <div class="dialog-head">
        <h2>保存済み案件</h2>
        <button class="icon-btn" value="cancel" aria-label="閉じる">x</button>
      </div>
      <div id="savedProjectsList" class="saved-list"></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
